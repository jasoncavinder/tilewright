[package]
name = "tilewright-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tooling powered by the Tilewright library."
readme = "README.md"
publish = false

[[bin]]
name = "tilewright"
path = "src/main.rs"
doc = false

[dependencies]
cap-std = "4.0.2"
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tilewright = { version = "0.1.0", path = "../tilewright" }

[dev-dependencies]
tempfile = "3.27.0"
