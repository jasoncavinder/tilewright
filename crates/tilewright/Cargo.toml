[package]
name = "tilewright"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for reading, validating, and editing tile-based RPG project data."
readme = "README.md"
publish = false

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
jsonc-parser = { version = "0.33.1", features = ["cst"] }

[dev-dependencies]
tempfile = "3.27.0"
