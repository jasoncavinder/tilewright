name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_matrix:
    name: Rust quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust with required components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Select stable Rust
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Test all targets and features
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Lint with Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  quality:
    name: Rust quality
    needs: quality_matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to pass
        env:
          MATRIX_RESULT: ${{ needs.quality_matrix.result }}
        run: test "$MATRIX_RESULT" = success
